# local-secret-store 是在服务器上独立 component，所有差异化配置放在服务器的 secret-store 里,不放在代码仓库里。
# ⚠️ metadata.name 必须是 **tradewind-pubsub** —— 与 auth / wechat-bot 一致。
# 本仓库原先写 "pubsub",导致 stocktake 发的事件与 auth 发的事件落在两条
# 互不相通的 bus 上(详见 notification-gateway/pubsub.yaml 顶部的完整说明)。
# dapr 的 component name 是路由键,发布方与订阅方必须逐字相同。
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: tradewind-pubsub
  namespace: default
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: "172.12.1.1:6379"
    - name: redisPassword
      secretKeyRef:
        name: redis.password
        key: redis.password
    - name: consumerID
      value: "{appID}"
    - name: enableDeadLetter
      value: "true"
    - name: deadLetterTTL
      value: "86400"
    - name: processingTimeout
      value: "30s"
    - name: redeliverInterval
      value: "30s"
auth:
  secretStore: local-secret-store