  # 2026-10-21 新增:cube-sync(cube → catalog 档案同步编排器)。
  #
  # ⚠️ 它**不连任何数据库** —— 只做编排:
  #   导出 ← cube-router GET /v1/export
  #   导入 → catalog     POST /archive/import
  # ⇒ 不需要 POSTGRES_DSN,也不带 dapr components(不订阅任何 topic)。
  #
  # ⚠️ 端口 8116:8110~8115 已占(见 deployer/tests/contract 的端口占用断言)。
  - main: ./cmd/cube-sync
    id: "cube-sync"
    binary: "cube-sync"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    ignore:
      - goos: linux
        goarch: arm64
      - goos: linux
        goarch: 386

  # 2026-10-22 新增:cube-async(服务层数据搬运编排器)。
  #
  # ⚠️ 它与 cube-sync 的区别只有一处,但很关键:
  #   cube-sync  : 导出直接问 cube-router(GET /v1/export)⇒ 只认 cube 里的数据;
  #   cube-async : 导出问**各服务自己的**归档导出端口(GET /archive/export)
  #                 ⇒ 源门店配了数据源就导 cube 的、没配就导本地的;
  #                 ⇒ 搬运方不需要知道 cube 的存在。
  #
  # ⚠️ 它同样**不连任何数据库** —— 只做编排。
  # ⚠️ 端口 8118:8110~8117 已占(cube-sync 8116 / cube-sync-member 8117)。
  - main: ./cmd/cube-async
    id: "cube-async"
    binary: "cube-async"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    ignore:
      - goos: linux
        goarch: arm64
      - goos: linux
        goarch: 386

  # 2026-10-21 新增:member(会员域)。
  #
  # ⚠️ 端口 8113:8110~8112 已占(sales-agg 8110 / pricing 8111 / sales-insight 8112),
  #    8113~8115 分给 member / pos / pos-gateway。
  #    (deployer/tests/contract 的端口占用断言会挡住冲突。)
  - main: ./cmd/member
    id: "member"
    binary: "member"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    ignore:
      - goos: linux
        goarch: arm64
      - goos: linux
        goarch: 386

archives:
  # 18 个 archive,每个 binary 一份,name_template 用 apps/<name>/ 前缀,这样
  # deploy-supertrade.ps1 自动在远端 <RemoteDir>/apps/<name>/ 下建子目录 + scp + 解压,
  # 镜像 cube 的 semantic-layers/<family>/ 模式 —— 不同 binary 不互相覆盖同名二进制。
  # wrap_in_directory: false —— 避免 tarball 内多套一层同名目录,确保解压后
  #   <name> 直接出现在 <RemoteDir>/apps/<name>/ 下,而不是
  #   <RemoteDir>/apps/<name>/<name>_<ver>_Linux_x86_64/<name>。
  # 没有 `files:` 块 —— 与 cube 的 sixun-hbposv7 不同,supertrade 没有 family 级
  # 共享 schema/config 目录,所以归档只装 binary 本身。
  - id: "catalog"
    format: tar.gz
    builds:
      - catalog
    wrap_in_directory: false
    name_template: 'apps/catalog/catalog_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'

  - id: "inventory"
    format: tar.gz
    builds:
      - inventory
    wrap_in_directory: false
    name_template: 'apps/inventory/inventory_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    # 2026-10-21:inventory 额外打包 pubsub 组件。
    # 缺它 ⇒ sidecar 加载不到 tradewind-pubsub ⇒ /dapr/subscribe 不被调用
    # ⇒ **sale.paid 永远送不到库存** ⇒ 卖货不扣库存,而且零报错。
    # 解压后顶层 = inventory + components/pubsub.yaml,与 systemd unit 的
    # `--resources-path /opt/YunBright/supertrade/apps/inventory/components` 对齐。
    files:
      - src: dapr/components/inventory/*
        dst: components

  - id: "cube-router"
    format: tar.gz
    builds:
      - cube-router
    wrap_in_directory: false
    name_template: 'apps/cube-router/cube-router_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'

  - id: "master-data"
    format: tar.gz
    builds:
      - master-data
    wrap_in_directory: false
    name_template: 'apps/master-data/master-data_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'

  - id: "stocktake"
    format: tar.gz
    builds:
      - stocktake
    wrap_in_directory: false
    name_template: 'apps/stocktake/stocktake_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    # 2026-10-07:stocktake 是盘点事件的**发布侧**
    # (service.NewDaprPublisherFromEnv → PublishEvent(ctx, eventbus.Name, topic, data))。
    # 以前 unit 里没有 --resources-path,sidecar 加载不到任何 component,
    # 于是 PublishEvent 找不到对应 component 直接失败 ——
    # 而 events.go:57-75 的 publish 是"尽力而为"(失败只 log),所以**故障完全静默**:
    # 盘点照常成功,只是没有任何事件推给 notification-gateway。
    #
    # ⚠️ component 的 metadata.name 必须是 tradewind-pubsub(pkg/eventbus.Name),
    #    与 auth(userd)的 DAPR_PUBSUB_NAME 逐字相同。改名会让事件静默消失。
    #
    # 解压后顶层 = stocktake + components/pubsub.yaml,与 systemd unit 的
    # `--resources-path /opt/YunBright/supertrade/apps/stocktake/components` 对齐。
    # 源路径必须是 dapr/components/<service>/:deploy-supertrade.ps1:445 写死了这条路径,
    # 单服务 deploy(goreleaser build,无 archive 阶段)时脚本会手工 stage 它。
    files:
      - src: dapr/components/stocktake/*
        dst: components

  - id: "pos"
    format: tar.gz
    builds:
      - pos
    wrap_in_directory: false
    name_template: 'apps/pos/pos_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    # 2026-10-21:pos 额外打包 pubsub 组件。
    # 缺它 ⇒ sidecar 加载不到 tradewind-pubsub ⇒ outbox 发布器找不到 component
    # ⇒ **sale.paid 发不出去** ⇒ 库存不扣、积分不加,而且零报错。
    files:
      - src: dapr/components/pos/*
        dst: components

  - id: "member"
    format: tar.gz
    builds:
      - member
    wrap_in_directory: false
    name_template: 'apps/member/member_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    # 2026-10-21:member 额外打包 pubsub 组件。
    # 它既是**发布侧**(member.opened / member.points.changed / member.updated),
    # 也是**订阅侧**(sale.paid ⇒ 累计积分)⇒ 两侧都要这条 bus。
    files:
      - src: dapr/components/member/*
        dst: components

  - id: "pos-gateway"
    format: tar.gz
    builds:
      - pos-gateway
    wrap_in_directory: false
    name_template: 'apps/pos-gateway/pos-gateway_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'

  - id: "pricing"
    format: tar.gz
    builds:
      - pricing
    wrap_in_directory: false
    name_template: 'apps/pricing/pricing_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'

  - id: "sales-insight"
    format: tar.gz
    builds:
      - sales-insight
    wrap_in_directory: false
    name_template: 'apps/sales-insight/sales-insight_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    # 2026-10-17：除二进制外还打包 conversation 组件（AI 解读要用）。
    # 缺它不会报错，只会**静默降级**成规则模式 —— 日报照发，只是没有归因叙述，
    # 所以「日报发得出去」不能证明 LLM 通着。
    # 源路径放 dapr/components/<service>/ 与 fresh-meat 一致（deploy-supertrade.ps1
    # 按这条路径 stage 单服务部署）。
    # 无 pubsub.yaml：本服务不订阅任何 topic。
    files:
      - src: dapr/components/sales-insight/*
        dst: components

  - id: "procurement"
    format: tar.gz
    builds:
      - procurement
    wrap_in_directory: false
    name_template: 'apps/procurement/procurement_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'

  - id: "sales-agg"
    format: tar.gz
    builds:
      - sales-agg
    wrap_in_directory: false
    name_template: 'apps/sales-agg/sales-agg_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'

  - id: "fresh-produce"
    format: tar.gz
    builds:
      - fresh-produce
    wrap_in_directory: false
    name_template: 'apps/fresh-produce/fresh-produce_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'

  - id: "fresh-meat"
    format: tar.gz
    builds:
      - fresh-meat
    wrap_in_directory: false
    name_template: 'apps/fresh-meat/fresh-meat_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    # 2026-10-01:fresh-meat 额外打包 dapr Component yaml。
    # 解压后顶层:
    #   fresh-meat            (binary,deploy-supertrade.ps1 chmod +x 自动识别)
    #   components/pubsub.yaml
    #   components/conversation.yaml
    # 落到 <RemoteDir>/apps/fresh-meat/components/ 下,与 systemd unit
    # `--resources-path /opt/YunBright/supertrade/apps/fresh-meat/components` 完全对齐。
    #
    # 源路径必须放在 `dapr/components/<service>/` 而不是 `apps/<service>/components/` —
    # deploy-supertrade.ps1:445 写死 `Join-Path $SupertradeDir (Join-Path 'dapr/components' $s)`,
    # 单服务 deploy 时(`goreleaser build --id fresh-meat`,无 archive 阶段)脚本手工 stage 这条路径。
    # 与 wechat-bot-manager 的 components 部署模式一致。
    #
    # 共享 dapr Configuration(/opt/YunBright/.dapr/config.yaml) 不在此处打包 —
    # 它由 stocktake / cube-router 等其它 supertrade-* app 部署链路共用,不在 fresh-meat 归档内。
    files:
      - src: dapr/components/fresh-meat/*
        dst: components

  - id: "erp-connector"
    format: tar.gz
    builds:
      - erp-connector
    wrap_in_directory: false
    name_template: 'apps/erp-connector/erp-connector_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'

  - id: "bi-gateway"
    format: tar.gz
    builds:
      - bi-gateway
    wrap_in_directory: false
    name_template: 'apps/bi-gateway/bi-gateway_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'

  - id: "notification-gateway"
    format: tar.gz
    builds:
      - notification-gateway
    wrap_in_directory: false
    name_template: 'apps/notification-gateway/notification-gateway_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    # 2026-10-07:与 fresh-meat / stocktake 同一套模式。
    # 没有这个 files 块时,单服务 deploy 出来的归档里只有裸二进制,
    # sidecar 找不到 pubsub component → /dapr/subscribe 永远不被调用
    # (表现就是"pubsub 没打通",但服务本身 /healthz 仍然 200,极易误判为已部署)。
    #
    # 解压后顶层 = notification-gateway + components/pubsub.yaml,
    # 与 systemd unit 的
    # `--resources-path /opt/YunBright/supertrade/apps/notification-gateway/components` 对齐。
    files:
      - src: dapr/components/notification-gateway/*
        dst: components

  - id: "settlement-auditor"
    format: tar.gz
    builds:
      - settlement-auditor
    wrap_in_directory: false
    name_template: 'apps/settlement-auditor/settlement-auditor_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    # 2026-10-10:settlement-auditor(结算付款审批机器一审)与 fresh-meat 同模式:
    # 归档除二进制外还带 dapr Component(pubsub + conversation)。
    # 没有 files 块时 sidecar 加载不到 tradewind-pubsub → /dapr/subscribe 不被调用,
    # wecom.approval.status_changed / command_result 回调静默丢失;
    # conversation component 缺失则 LLM 研判直接报错(流水线会走规则降级)。
    #
    # 解压后顶层 = settlement-auditor + components/{pubsub,conversation}.yaml,
    # 与 systemd unit 的
    # `--resources-path /opt/YunBright/supertrade/apps/settlement-auditor/components` 对齐。
    # 源路径必须是 dapr/components/<service>/(deploy-supertrade.ps1 单服务 deploy 时
    # 手工 stage 这条路径,见该脚本 build 步骤注释)。
    files:
      - src: dapr/components/settlement-auditor/*
        dst: components

  # 2026-10-21 新增:cube-sync。
  # 没有 files 块 —— 它不订阅任何 topic,不需要 dapr Component。
  - id: "cube-sync"
    format: tar.gz
    builds:
      - cube-sync
    wrap_in_directory: false
    name_template: 'apps/cube-sync/cube-sync_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'

  # 2026-10-22 新增:cube-async(服务层搬运编排器)。
  # 同样没有 files 块 —— 它不订阅任何 topic。
  - id: "cube-async"
    format: tar.gz
    builds:
      - cube-async
    wrap_in_directory: false
    name_template: 'apps/cube-async/cube-async_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

