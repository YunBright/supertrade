# .goreleaser configuration for supertrade
#
# 生产部署由 F:\go\src\github.com\YunBright\deployer\deploy-supertrade.ps1 驱动。
# 该脚本的契约(必须严格满足):
#   - 必须在 <SupertradeDir>/dist/ 下产出 18 个 .tar.gz 归档(每个二进制一个)
#   - 归档文件名 = <project>_<version>_<OS>_<arch>.tar.gz(被脚本当 leaf 传到 ssh tar -xzf)
#   - 解压必须能在 <RemoteDir>/apps/<name>/ 下完成,extract 步骤是
#     `cd <归档所在父目录> && tar -xzf <leaf>`,所以归档内部结构 = 生产 cwd 的内容
#   - chmod 步骤用正则 `^\s*binary:\s*"?([^"\s#]+)"?` 从本文件提取 binary 名,然后
#     `find <RemoteDir>/apps -type f \( -name '<binary>' ... \)` 递归 chmod +x
#   - 因此 `binary: <name>` 必须保留,且二进制在归档顶层就叫 <name>(不能带目录前缀)
#   - 每个 build 的 `id` 必须等于 `binary`,因为 deploy-supertrade.ps1 用
#     `goreleaser build --id <name> --clean --snapshot` 按 build id 过滤(注意
#     `goreleaser build` 接受 --id,但 `goreleaser release` 不接受;因此单服务部署
#     必须用 build 子命令而不是 release)。脚本会再把 build 出来的二进制手工
#     tar.gz 包成 apps/<name>/<name>_<ver>_Linux_x86_64.tar.gz。
#
# 生产远端目录布局(由 deploy-supertrade.ps1 拼出来):
#   <RemoteDir>/                          ← 根,不放东西,只作为容器
#     apps/
#       catalog/                          ← catalog 的 cwd
#         catalog                         ← 二进制
#       inventory/
#         inventory
#       cube-router/                      ← cube-router(2026-09 PR 1 新增)
#         cube-router
#       master-data/
#         master-data
#       stocktake/
#         stocktake
#       pos/ pos-gateway/ pricing/ procurement/ sales-agg/
#       fresh-produce/ fresh-meat/ erp-connector/ bi-gateway/
#       notification-gateway/
#       fresh-meat/                       ← 2026-10-01 特殊:除二进制外还含 components/
#         fresh-meat                      ← 二进制
#         components/                     ← dapr Component(pubsub + conversation)
#           pubsub.yaml                   ← 由 .goreleaser "files" 块打包
#           conversation.yaml             ← 由 .goreleaser "files" 块打包
#         (systemd --resources-path 写死指这里)
#       settlement-auditor/               ← 2026-10-10 同 fresh-meat:二进制 + components/
#         settlement-auditor
#         components/{pubsub,conversation}.yaml
#
# 端口约定:catalog :8101, inventory :8102, master-data :8103, cube-router :8116,
# stocktake :8106, fresh-meat :8108, settlement-auditor :8109, sales-agg :8110,
# pricing :8111, sales-insight :8112;
# 其它 binary 默认监听 :8080(其中 pos/pricing/procurement/sales-agg/
# fresh-produce/fresh-meat/erp-connector/bi-gateway/master-data 当前
# 只响应 /healthz placeholder;stocktake 需要 POSTGRES_DSN,真正使用 PG;
# pos-gateway 与 notification-gateway 是真实业务进程;cube-router 需要
# POSTGRES_DSN,真正使用 PG)。
# ⚠️ 2026-10-17 新增 sales-insight(AI 销售日报/周报/月报,cmd/sales-insight):
#    LLM 解读 + **读取**每日销售事实库。
#    ⚠️ 2026-10-18 起它**需要 POSTGRES_DSN**:每天 22:45 由 sales-agg
#    采集落 PG 的 sales_daily_*(见 internal/salesdaily),AI 日报与月报
#    优先读那一行、覆盖不全才整段回退查 cube。
#    **它只读不写**:不 AutoMigrate、不补采 —— 写者唯一是 sales-agg。
#    DSN 缺失时**不阻止启动**,退化成每次现查 cube(功能仍在,只是
#    同一个营业日可能两次查到不同的数),healthz 的
#    `daily_store_ready=false` 会显式暴露这件事。
#    报告与审计仍由 wechat-bot 落 dapr state。
#    无自有 components 目录(不订阅任何 topic)。
#    ⚠️ 它会调 cube(库存/天气/回退路径),与 sales-agg 一样
#    **Requires=cube-gateway.service**。
#    ⚠️ 端口 8112 是 2026-10-17 实测后定的:8111 已被 pricing 占用
#    (deployer/tests/contract 的 TestPricingPortIsNotTaken 会报冲突)。
# ⚠️ 2026-10-15:pricing **不再是** placeholder —— 它已实现 POP 价签的
#    价格/促销查询(cube product + cube promotion),并有 systemd unit +
#    nginx map 行,见 deployer/systemd/supertrade-pricing.service。
#    它仍**不需要 POSTGRES_DSN**(不拥有任何表)。
# 远端 :8080 端口冲突由 Dapr sidecar 端口分配 + nginx map 规则解决,
# 具体路由规则见 .claude/rules/00-app-catalog.md,本脚本不涉及。
#
# https://goreleaser.com

project_name: supertrade

before:
  hooks:
    - go mod tidy

builds:
  # 18 个 binary,每个 build 的 id == binary 名。这样 `goreleaser --id stocktake`
  # 会只构建 stocktake 一个并产出 dist/apps/stocktake/stocktake_<ver>_Linux_x86_64.tar.gz,
  # 是 deploy-supertrade.ps1 -Service <name> 单服务部署的根基。
  - main: ./cmd/catalog
    id: "catalog"
    binary: "catalog"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    ignore:
      - goos: linux
        goarch: arm64
      - goos: linux
        goarch: 386

  - main: ./cmd/inventory
